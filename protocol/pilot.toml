# Pilot settings for deciding the counts and calibrated values of the main run.
# The selected cells and numeric settings are here; protocol.py builds their
# arms and sequence jobs according to the exposé.
#
# Store fractions as strings, for example alpha = "1/2". The loader converts
# them to Fraction. Leave out optional values that are not set, since TOML has
# no null value.
#
# These counts are placeholders. The full job list also needs robustness_scale
# and workforce_factor because their cells are selected below. Until these are
# set, jobs() refuses to build the full pilot matrix.

name = "pilot"
date = ""            # This is the pilot, not the frozen main run.
root_seed = 20261109 # Keep pilot draws separate from the main root seed.

horizon = 15         # T: number of perturbation steps.
size_classes = [20, 40, 80]
cells = ["main", "rq2", "robustness", "undersupplied"]

n_instances_secondary = 2
n_sequences = 2      # N_Q per instance and RQ1 profile.

lam = 2              # WQS quality cost per changed cell.
alpha = "1"          # HWF history weight, parsed as a Fraction.
lam_grid = [1, 4]
alpha_grid = ["1/2", "2"]

# Optional fields below are currently unset. The two required calibration
# values must be supplied for the selected robustness and under-supplied cells:
# sensitivity_instances, robustness_scale, rq2_background_scale, workforce_factor

[n_instances]        # N_I per size class; the loader converts the keys to integers.
20 = 2
40 = 2
80 = 2

[solver]
time_limit = 60.0    # tau: seconds allowed for each stage.
s0_time_limit = 60.0
seed = 0
threads = 1
retry_factor = 2.0

# Add [generator] to override GeneratorConfig fields. Without it, use Table A1 defaults.
